<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AralNa | 500 Knowledge Trials & Learning Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { color-scheme: light; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f0fdf4;
            background-image:
                radial-gradient(ellipse at 12% 8%, rgba(134, 239, 172, 0.38), transparent 34rem),
                radial-gradient(ellipse at 88% 24%, rgba(74, 222, 128, 0.2), transparent 30rem);
            background-attachment: fixed;
        }
        [x-cloak] { display: none !important; }
        .glow-blue { box-shadow: 0 24px 80px rgba(20, 83, 45, 0.12), 0 0 35px rgba(34, 197, 94, 0.12); }
        button, input { -webkit-tap-highlight-color: transparent; }
        button { transition: transform 180ms ease, box-shadow 180ms ease, background-color 180ms ease, border-color 180ms ease; }
        button:hover:not(:disabled) { transform: translateY(-1px); }
        button:active:not(:disabled) { transform: translateY(0) scale(0.99); }
        button:focus-visible, input:focus-visible { outline: 2px solid #16a34a; outline-offset: 3px; }
        input { caret-color: #16a34a; }
        *, *::before, *::after { animation: none !important; transition: none !important; }
        button:hover:not(:disabled) { transform: none; }
        .answer-correct, .answer-wrong { box-shadow: none; }
    </style>
</head>
<body class="bg-green-50 text-green-950 min-h-screen selection:bg-green-600 selection:text-green-950" x-data="learningGame()">

    <!-- HEADER -->
    <header class="border-b border-green-200 bg-white/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-18 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" @click="resetGame()">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-green-600 via-green-600 to-lime-500 flex items-center justify-center font-black text-2xl shadow-lg shadow-green-300/50 text-green-950 drop-shadow tracking-tighter" style="font-family: Georgia, 'Times New Roman', serif;">AN</div>
                <div>
                    <span class="text-lg font-black tracking-wider bg-gradient-to-r from-green-800 via-green-600 to-lime-500 bg-clip-text text-transparent block">AralNa</span>
                    <span class="text-[10px] text-green-800 uppercase tracking-widest font-bold">500 Learning Trials</span>
                </div>
            </div>
            
            <template x-if="gameState === 'playing' || gameState === 'gameover'">
                <div class="flex items-center gap-3 text-xs font-bold">
                    <div class="px-3 py-1.5 rounded-xl bg-green-200/50 border border-green-300/60 text-green-800">
                        XP: <span class="text-green-950 font-black" x-text="xp + ' XP'"></span>
                    </div>
                    <div class="px-3 py-1.5 rounded-xl bg-green-200/50 border border-green-300/60 text-green-800">
                        Rank: <span class="text-green-700 font-black" x-text="playerRank"></span>
                    </div>
                </div>
            </template>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-3xl mx-auto px-4 py-10">

        <!-- SCREEN 1: LOBBY & SETUP -->
        <template x-if="gameState === 'lobby'">
            <div class="bg-white border border-green-200/80 rounded-3xl p-6 sm:p-10 shadow-2xl glow-blue text-center">
                <span class="px-3.5 py-1 rounded-full bg-green-200/80 border border-green-400/60 text-green-800 text-xs font-bold uppercase tracking-widest inline-block mb-4">
                    🎓 Gamified Knowledge Hub
                </span>
                <h1 class="text-3xl sm:text-4xl font-black text-green-950 mb-3">Embark on 500 Learning Trials</h1>
                <p class="text-xs sm:text-sm text-green-800 max-w-md mx-auto mb-8">Master 500 learning trials across Science, History, Math, Tech, Geography, and more. Level up from Novice to Grandmaster!</p>

                <div class="space-y-5 text-left max-w-md mx-auto mb-8">
                    <div>
                        <label class="block text-xs font-bold text-green-800 uppercase tracking-wider mb-2">Scholar Name</label>
                        <input type="text" x-model="playerName" placeholder="Enter your scholar handle..." class="w-full bg-green-50 border border-green-300/60 rounded-xl px-4 py-3 text-sm text-green-950 placeholder-green-500 focus:outline-none focus:border-green-600 transition-all font-semibold">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-green-800 uppercase tracking-wider mb-2">Select Subject Domain</label>
                        <div class="grid grid-cols-2 gap-2.5">
                            <button @click="selectedSubject = 'all'" :class="selectedSubject === 'all' ? 'bg-green-600 border-green-500 text-green-950 font-bold' : 'bg-green-50 border-green-200 text-green-800'" class="p-3 rounded-xl border text-xs text-center transition-all">🌟 All 500 Learning Trials</button>
                            <button @click="selectedSubject = 'Science'" :class="selectedSubject === 'Science' ? 'bg-green-600 border-green-500 text-green-950 font-bold' : 'bg-green-50 border-green-200 text-green-800'" class="p-3 rounded-xl border text-xs text-center transition-all">🔬 Science & Cosmos</button>
                            <button @click="selectedSubject = 'History'" :class="selectedSubject === 'History' ? 'bg-green-600 border-green-500 text-green-950 font-bold' : 'bg-green-50 border-green-200 text-green-800'" class="p-3 rounded-xl border text-xs text-center transition-all">🏛️ World History</button>
                            <button @click="selectedSubject = 'Tech'" :class="selectedSubject === 'Tech' ? 'bg-green-600 border-green-500 text-green-950 font-bold' : 'bg-green-50 border-green-200 text-green-800'" class="p-3 rounded-xl border text-xs text-center transition-all">💻 Tech & Logic</button>
                            <button @click="selectedSubject = 'Math'" :class="selectedSubject === 'Math' ? 'bg-green-600 border-green-500 text-green-950 font-bold' : 'bg-green-50 border-green-200 text-green-800'" class="p-3 rounded-xl border text-xs text-center transition-all">➗ Math & Numbers</button>
                        </div>
                    </div>
                </div>

                <button @click="startGame()" class="w-full max-w-md py-4 rounded-2xl bg-gradient-to-r from-green-600 via-green-600 to-green-600 hover:opacity-95 font-black text-sm text-green-950 shadow-xl shadow-green-300/40 transition-all active:scale-95 uppercase tracking-wider">
                    Begin Trial 🚀
                </button>
            </div>
        </template>

        <!-- SCREEN 2: ACTIVE TRIAL ROUND -->
        <template x-if="gameState === 'playing'">
            <div class="bg-white border border-green-200/80 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
                
                <!-- Status Bar & Progress -->
                <div class="flex justify-between items-center mb-6">
                    <span class="text-xs font-bold uppercase tracking-widest text-green-800" x-text="'Trial ' + (currentIndex + 1) + ' of ' + activeQuestions.length"></span>
                    <div class="flex items-center gap-2">
                        <span class="px-3 py-1 rounded-lg bg-green-200/60 border border-green-300/60 text-green-800 text-xs font-bold uppercase tracking-wider" x-text="currentQuestion.subject"></span>
                        <button @click="pauseGame()" class="px-3 py-1 rounded-lg bg-green-200/60 border border-green-300/60 text-green-800 text-xs font-bold hover:bg-green-300/70 transition-all">⏸ Pause</button>
                    </div>
                </div>

                <!-- Progress Bar -->
                <div class="w-full bg-green-200/40 h-2 rounded-full mb-8 overflow-hidden">
                    <div class="bg-gradient-to-r from-green-500 to-green-600 h-full transition-all duration-500" :style="`width: ${((currentIndex + 1) / activeQuestions.length) * 100}%`"></div>
                </div>

                <!-- Question / Learning Box -->
                <div class="bg-green-50 border border-green-300/60 rounded-2xl p-6 sm:p-8 mb-8 shadow-inner">
                    <span class="text-[10px] uppercase font-extrabold text-green-800 tracking-widest block mb-2">Knowledge Challenge:</span>
                    <p class="text-lg sm:text-xl font-bold text-green-950 tracking-wide" x-text="currentQuestion.prompt"></p>
                </div>

                <!-- Options Grid -->
                <div class="grid grid-cols-1 gap-3.5 mb-6">
                    <template x-for="(option, index) in currentQuestion.options" :key="index">
                        <button @click="submitAnswer(option)" 
                                :disabled="answered"
                                :class="{
                                    'bg-green-200/40 border-green-300/70 hover:bg-green-300/50 text-green-800': !answered,
                                    'bg-emerald-600 border-emerald-500 text-green-950 font-bold answer-feedback answer-correct': answered && option === currentQuestion.answer,
                                    'bg-rose-600 border-rose-500 text-green-950 font-bold answer-feedback answer-wrong': answered && selectedAnswer === option && option !== currentQuestion.answer,
                                    'opacity-40': answered && option !== currentQuestion.answer && option !== selectedAnswer
                                }"
                                class="p-4 rounded-2xl border text-xs sm:text-sm font-semibold transition-all text-left flex items-center justify-between"
                        >
                            <span x-text="option"></span>
                            <span class="text-xs font-bold px-2.5 py-1 rounded bg-black/40 text-green-800" x-text="['A', 'B', 'C', 'D'][index]"></span>
                        </button>
                    </template>
                </div>

                <!-- Educational Explanation Card (Shown after answering) -->
                <div x-show="answered" x-transition class="answer-feedback rounded-2xl p-4 mb-3 text-sm font-extrabold" :class="selectedAnswer === currentQuestion.answer ? 'bg-emerald-100 border border-emerald-400 text-emerald-900 answer-correct' : 'bg-rose-100 border border-rose-400 text-rose-900 answer-wrong'" role="status" aria-live="polite">
                    <span x-text="selectedAnswer === currentQuestion.answer ? '✅ Correct! Great job!' : '❌ Not quite—keep learning!' "></span>
                </div>
                <div x-show="answered" x-transition class="bg-green-100/40 border border-green-300/60 rounded-2xl p-4 text-xs text-green-800">
                    <span class="font-bold text-green-700 uppercase tracking-widest block mb-1">💡 Learning Insight:</span>
                    <span x-text="currentQuestion.explanation"></span>
                </div>
            </div>
        </template>

        <!-- PAUSED SCREEN -->
        <template x-if="gameState === 'paused'">
            <div class="bg-white border border-green-200/80 rounded-3xl p-8 sm:p-10 shadow-2xl glow-blue text-center">
                <div class="w-16 h-16 rounded-3xl bg-green-200/80 mx-auto flex items-center justify-center text-3xl mb-4">⏸️</div>
                <h2 class="text-3xl font-black text-green-950 mb-2">Game Paused</h2>
                <p class="text-sm text-green-800 mb-8">Your progress is saved. Resume when you’re ready, or return to the menu to choose another subject.</p>
                <div class="flex gap-3 max-w-md mx-auto">
                    <button @click="resumeGame()" class="flex-1 py-3.5 rounded-xl bg-gradient-to-r from-green-600 to-lime-500 font-black text-xs text-green-950 shadow-lg transition-all uppercase tracking-wider">
                        Resume ▶
                    </button>
                    <button @click="resetGame()" class="flex-1 py-3.5 rounded-xl bg-green-200/80 border border-green-400 hover:bg-green-300/80 font-bold text-xs text-green-800 transition-all uppercase tracking-wider">
                        Main Menu
                    </button>
                </div>
            </div>
        </template>

        <!-- SCREEN 3: GAME OVER / ACADEMIC REPORT -->
        <template x-if="gameState === 'gameover'">
            <div class="bg-white border border-green-200/80 rounded-3xl p-8 sm:p-10 shadow-2xl glow-blue text-center">
                <div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-green-600 to-lime-500 flex items-center justify-center text-3xl shadow-lg mx-auto mb-4">🏆</div>
                <h2 class="text-3xl font-black text-green-950 mb-1">Trial Complete!</h2>
                <p class="text-sm font-black mb-2" :class="passed ? 'text-emerald-700' : 'text-amber-700'" x-text="passed ? '🎉 PASS — You did it! Keep shining!' : '🌱 NOT YET — Keep practicing; you can do it!' "></p>
                <p class="text-xs text-green-800 mb-6" x-text="'Outstanding effort, Scholar ' + playerName + '!'"></p>

                <div class="bg-green-50 border border-green-300/60 rounded-2xl p-6 max-w-sm mx-auto mb-8 space-y-3">
                    <div class="flex justify-between text-xs font-semibold">
                        <span class="text-green-800">Total XP Earned:</span>
                        <span class="text-green-950 font-black text-sm" x-text="xp + ' XP'"></span>
                    </div>
                    <div class="flex justify-between text-xs font-semibold">
                        <span class="text-green-800">Final Rank:</span>
                        <span class="text-green-700 font-black text-sm" x-text="playerRank"></span>
                    </div>
                    <div class="flex justify-between text-xs font-semibold">
                        <span class="text-green-800">Final Score:</span>
                        <span class="text-emerald-700 font-black text-sm" x-text="correctCount + ' / ' + activeQuestions.length + ' (' + scorePercentage + '%)'"></span>
                    </div>
                </div>

                <div class="flex gap-3 max-w-md mx-auto">
                    <button @click="resetGame()" class="flex-1 py-3.5 rounded-xl bg-green-200/80 border border-green-400 hover:bg-green-300/80 font-bold text-xs text-green-800 transition-all uppercase tracking-wider">
                        Main Menu
                    </button>
                    <button @click="resetGame()" class="flex-1 py-3.5 rounded-xl bg-gradient-to-r from-green-600 to-lime-500 hover:opacity-90 font-black text-xs text-green-950 shadow-lg shadow-green-300/40 transition-all uppercase tracking-wider">
                        Choose Subject 🔄
                    </button>
                </div>
            </div>
        </template>

    </main>

    <!-- NOTIFICATION TOAST -->
    <div x-show="toastMessage" x-transition class="fixed bottom-6 right-6 bg-green-50 border border-green-600/80 text-green-950 px-5 py-4 rounded-2xl shadow-2xl text-xs font-bold z-50 flex items-center gap-3">
        <span class="text-green-800 text-base">✨</span>
        <span x-text="toastMessage"></span>
    </div>

    <!-- JS LEARNING ENGINE & 100 KNOWLEDGE ITEMS -->
    <script>
        function learningGame() {
            return {
                gameState: 'lobby', // lobby, playing, gameover
                playerName: '',
                selectedSubject: 'all',
                runQuestions: [],
                seenQuestions: {},
                xp: 0,
                correctCount: 0,
                currentIndex: 0,
                answered: false,
                selectedAnswer: null,
                toastMessage: '',
                pendingTimeout: null,

                init() {
                    this.masterBank = this.masterBank.concat(this.buildMathQuestions());
                },

                buildMathQuestions() {
                    const questions = [];
                    for (let left = 1; left <= 20; left++) {
                        for (let right = 1; right <= 20; right++) {
                            const answer = left * right;
                            const options = [answer, answer + 1, answer + 2, answer + 3];
                            for (let i = options.length - 1; i > 0; i--) {
                                const j = Math.floor(Math.random() * (i + 1));
                                [options[i], options[j]] = [options[j], options[i]];
                            }
                            questions.push({
                                subject: 'Math',
                                prompt: `What is ${left} × ${right}?`,
                                answer,
                                options,
                                explanation: `${left} groups of ${right} make ${answer}.`
                            });
                        }
                    }
                    return questions;
                },

                get scorePercentage() {
                    return this.activeQuestions.length
                        ? Math.round((this.correctCount / this.activeQuestions.length) * 100)
                        : 0;
                },

                get passed() {
                    return this.scorePercentage >= 60;
                },

                get playerRank() {
                    if (this.xp >= 1500) return 'Grandmaster Scholar 👑';
                    if (this.xp >= 800) return 'Expert Researcher 🔬';
                    if (this.xp >= 300) return 'Advanced Student 📚';
                    return 'Novice Scholar 🌱';
                },

                // 100 curated questions plus 400 generated multiplication challenges.
                masterBank: [
                    // SCIENCE (1-20)
                    { subject: 'Science', prompt: 'What is the chemical symbol for Gold?', answer: 'Au', options: ['Ag', 'Au', 'Gd', 'Pb'], explanation: 'Au comes from the Latin word aurum, meaning shining dawn.' },
                    { subject: 'Science', prompt: 'Which planet is known as the Red Planet?', answer: 'Mars', options: ['Venus', 'Mars', 'Jupiter', 'Saturn'], explanation: 'Mars appears red due to iron oxide (rust) prevalent on its surface.' },
                    { subject: 'Science', prompt: 'What gas do plants absorb from the atmosphere for photosynthesis?', answer: 'Carbon dioxide', options: ['Oxygen', 'Nitrogen', 'Carbon dioxide', 'Hydrogen'], explanation: 'Plants use sunlight, water, and carbon dioxide to create oxygen and energy.' },
                    { subject: 'Science', prompt: 'What is the powerhouse of the cell?', answer: 'Mitochondria', options: ['Nucleus', 'Ribosome', 'Mitochondria', 'Chloroplast'], explanation: 'Mitochondria generate most of the chemical energy needed to power cellular biochemical reactions.' },
                    { subject: 'Science', prompt: 'What is the speed of light in a vacuum (approx.)?', answer: '300,000 km/s', options: ['150,000 km/s', '300,000 km/s', '450,000 km/s', '1,000,000 km/s'], explanation: 'Light travels at approximately 299,792 kilometers per second in a vacuum.' },
                    { subject: 'Science', prompt: 'What part of the human brain controls balance and coordination?', answer: 'Cerebellum', options: ['Cerebrum', 'Brainstem', 'Cerebellum', 'Thalamus'], explanation: 'The cerebellum is located at the back of the brain and regulates motor movements.' },
                    { subject: 'Science', prompt: 'What is the hardest natural substance on Earth?', answer: 'Diamond', options: ['Gold', 'Iron', 'Diamond', 'Quartz'], explanation: 'Diamond is an allotrope of carbon arranged in a cubic crystal lattice structure.' },
                    { subject: 'Science', prompt: 'What is the most abundant gas in Earth’s atmosphere?', answer: 'Nitrogen', options: ['Oxygen', 'Nitrogen', 'Carbon dioxide', 'Argon'], explanation: 'Nitrogen makes up about 78% of Earth’s atmosphere by volume.' },
                    { subject: 'Science', prompt: 'What is the medical term for high blood pressure?', answer: 'Hypertension', options: ['Hypotension', 'Hypertension', 'Tachycardia', 'Anemia'], explanation: 'Hypertension forces blood against artery walls at dangerously high levels.' },
                    { subject: 'Science', prompt: 'What force keeps planets in orbit around the Sun?', answer: 'Gravity', options: ['Magnetism', 'Centrifugal force', 'Gravity', 'Friction'], explanation: 'Isaac Newton formulated the universal law of gravitation.' },
                    { subject: 'Science', prompt: 'How many bones are in the adult human body?', answer: '206', options: ['198', '206', '215', '220'], explanation: 'Babies are born with around 270 bones, which fuse together over time into 206.' },
                    { subject: 'Science', prompt: 'What is the pH level of pure water?', answer: '7', options: ['5', '7', '9', '14'], explanation: 'A pH of 7 is considered perfectly neutral on the acidity/alkalinity scale.' },
                    { subject: 'Science', prompt: 'Which blood type is known as the universal donor?', answer: 'O negative', options: ['A positive', 'AB positive', 'O negative', 'B negative'], explanation: 'O negative red blood cells can be given to patients of any blood type.' },
                    { subject: 'Science', prompt: 'What is the nearest star to Earth after the Sun?', answer: 'Proxima Centauri', options: ['Sirius', 'Alpha Centauri', 'Proxima Centauri', 'Betelgeuse'], explanation: 'Proxima Centauri is approximately 4.24 light-years away from Earth.' },
                    { subject: 'Science', prompt: 'What subatomic particle carries a negative electrical charge?', answer: 'Electron', options: ['Proton', 'Neutron', 'Electron', 'Positron'], explanation: 'Electrons orbit the nucleus of an atom and possess negative charges.' },
                    { subject: 'Science', prompt: 'What process do stars use to generate energy in their cores?', answer: 'Nuclear fusion', options: ['Nuclear fission', 'Nuclear fusion', 'Combustion', 'Oxidation'], explanation: 'Nuclear fusion merges hydrogen atoms to form helium under extreme heat and pressure.' },
                    { subject: 'Science', prompt: 'What is the primary organ of the human integumentary system?', answer: 'Skin', options: ['Liver', 'Skin', 'Heart', 'Kidneys'], explanation: 'The skin protects the body and regulates temperature.' },
                    { subject: 'Science', prompt: 'What galaxy is Earth located in?', answer: 'Milky Way', options: ['Andromeda', 'Milky Way', 'Sombrero', 'Triangulum'], explanation: 'The Milky Way is a barred spiral galaxy containing hundreds of billions of stars.' },
                    { subject: 'Science', prompt: 'What is the freezing point of water in Fahrenheit?', answer: '32°F', options: ['0°F', '32°F', '100°F', '212°F'], explanation: 'In Celsius, freezing is 0°C, which translates to 32°F.' },
                    { subject: 'Science', prompt: 'What vitamin is synthesized in human skin when exposed to sunlight?', answer: 'Vitamin D', options: ['Vitamin A', 'Vitamin C', 'Vitamin D', 'Vitamin K'], explanation: 'Vitamin D helps regulate calcium and phosphorus levels in the body.' },

                    // HISTORY (21-40)
                    { subject: 'History', prompt: 'In what year did World War II end?', answer: '1945', options: ['1939', '1942', '1945', '1950'], explanation: 'WWII concluded in 1945 following the surrender of Axis powers.' },
                    { subject: 'History', prompt: 'Who was the first emperor of the Roman Empire?', answer: 'Augustus', options: ['Julius Caesar', 'Augustus', 'Nero', 'Constantine'], explanation: 'Augustus (Octavian) established the Roman Empire in 27 BC.' },
                    { subject: 'History', prompt: 'The ancient city of Babylon was located in modern-day which country?', answer: 'Iraq', options: ['Egypt', 'Greece', 'Iraq', 'Iran'], explanation: 'Babylon ruins lie in present-day Hillah, Iraq.' },
                    { subject: 'History', prompt: 'What year did the Berlin Wall fall?', answer: '1989', options: ['1985', '1989', '1991', '1995'], explanation: 'The fall of the Berlin Wall marked a pivotal milestone in German reunification.' },
                    { subject: 'History', prompt: 'Who painted the ceiling of the Sistine Chapel?', answer: 'Michelangelo', options: ['Leonardo da Vinci', 'Raphael', 'Michelangelo', 'Donatello'], explanation: 'Michelangelo Buonarroti painted the masterpiece between 1508 and 1512.' },
                    { subject: 'History', prompt: 'Which empire built the monumental ancient road network known as Qhapaq Ñan?', answer: 'Inca Empire', options: ['Roman Empire', 'Inca Empire', 'Ottoman Empire', 'Persian Empire'], explanation: 'The Inca Empire spanned the Andes mountains in South America.' },
                    { subject: 'History', prompt: 'Who was the first woman to win a Nobel Prize?', answer: 'Marie Curie', options: ['Rosalind Franklin', 'Marie Curie', 'Ada Lovelace', 'Florence Nightingale'], explanation: 'Marie Curie won the 1903 Nobel Prize in Physics.' },
                    { subject: 'History', prompt: 'In what year did the Titanic sink in the Atlantic Ocean?', answer: '1912', options: ['1905', '1912', '1918', '1923'], explanation: 'RMS Titanic struck an iceberg and sank on her maiden voyage in April 1912.' },
                    { subject: 'History', prompt: 'Who wrote the political treatise "The Prince"?', answer: 'Niccolò Machiavelli', options: ['Plato', 'Aristotle', 'Niccolò Machiavelli', 'Thomas Hobbes'], explanation: 'Machiavelli penned the classic work on political realism in 1513.' },
                    { subject: 'History', prompt: 'What ancient civilization built the monumental pyramids of Giza?', answer: 'Ancient Egyptians', options: ['Mayans', 'Ancient Egyptians', 'Mesopotamians', 'Romans'], explanation: 'The pyramids served as majestic tombs for Egyptian pharaohs.' },
                    { subject: 'History', prompt: 'What treaty officially ended World War I in 1919?', answer: 'Treaty of Versailles', options: ['Treaty of Paris', 'Treaty of Versailles', 'Treaty of Ghent', 'Treaty of Vienna'], explanation: 'The treaty imposed significant reparations and territorial adjustments on Germany.' },
                    { subject: 'History', prompt: 'Who was the longest-reigning British monarch prior to Queen Elizabeth II?', answer: 'Queen Victoria', options: ['King George III', 'Queen Victoria', 'King Henry VIII', 'Queen Mary I'], explanation: 'Queen Victoria reigned for 63 years and 7 months.' },
                    { subject: 'History', prompt: 'The Renaissance period originated in which European country?', answer: 'Italy', options: ['France', 'Spain', 'Italy', 'England'], explanation: 'Florence, Italy became the cultural cradle of the Renaissance.' },
                    { subject: 'History', prompt: 'Who was the leader of the Soviet Union during World War II?', answer: 'Joseph Stalin', options: ['Vladimir Lenin', 'Joseph Stalin', 'Nikita Khrushchev', 'Leon Trotsky'], explanation: 'Stalin led the USSR through the Great Patriotic War.' },
                    { subject: 'History', prompt: 'What ancient wonder was located in Alexandria, Egypt?', answer: 'The Lighthouse', options: ['The Colossus', 'The Lighthouse', 'The Hanging Gardens', 'The Mausoleum'], explanation: 'The Pharos Lighthouse guided ships safely into Alexandria harbor.' },
                    { subject: 'History', prompt: 'In what year did the American Declaration of Independence get adopted?', answer: '1776', options: ['1765', '1776', '1789', '1812'], explanation: 'The Continental Congress formally adopted the declaration on July 4, 1776.' },
                    { subject: 'History', prompt: 'Who circumnavigated the globe first (expedition completion)?', answer: 'Ferdinand Magellan’s crew', options: ['Christopher Columbus', 'Vasco da Gama', 'Ferdinand Magellan’s crew', 'James Cook'], explanation: 'Juan Sebastián Elcano completed the voyage after Magellan died in the Philippines.' },
                    { subject: 'History', prompt: 'What was the name of the first artificial satellite launched into space?', answer: 'Sputnik 1', options: ['Explorer 1', 'Sputnik 1', 'Vostok 1', 'Hubble'], explanation: 'The Soviet Union launched Sputnik 1 in October 1957.' },
                    { subject: 'History', prompt: 'Which civilization developed the earliest known writing system, cuneiform?', answer: 'Sumerians', options: ['Egyptians', 'Sumerians', 'Phoenicians', 'Chinese'], explanation: 'Sumerians etched cuneiform symbols onto wet clay tablets.' },

                    { subject: 'Literature', prompt: 'Who wrote the dystopian novel "Brave New World"?', answer: 'Aldous Huxley', options: ['George Orwell', 'Aldous Huxley', 'Ray Bradbury', 'Kurt Vonnegut'], explanation: 'Huxley explored a futuristic society engineered by controlled biotechnology.' }
                ],

                get activeQuestions() {
                    return this.runQuestions;
                },

                get currentQuestion() {
                    return this.activeQuestions[this.currentIndex] || this.activeQuestions[0];
                },

                pauseGame() {
                    if (this.gameState !== 'playing') return;
                    if (this.pendingTimeout) {
                        clearTimeout(this.pendingTimeout);
                        this.pendingTimeout = null;
                    }
                    this.gameState = 'paused';
                },

                resumeGame() {
                    if (this.gameState !== 'paused') return;
                    this.gameState = 'playing';
                    if (this.answered) this.scheduleNextQuestion();
                },

                scheduleNextQuestion() {
                    this.pendingTimeout = setTimeout(() => {
                        this.pendingTimeout = null;
                        if (this.currentIndex < this.activeQuestions.length - 1) {
                            this.currentIndex++;
                            const questionIndex = this.masterBank.indexOf(this.currentQuestion);
                            this.seenQuestions[questionIndex] = true;
                            this.answered = false;
                            this.selectedAnswer = null;
                        } else {
                            this.gameState = 'gameover';
                        }
                    }, 3500);
                },

                startGame() {
                    if (!this.playerName.trim()) {
                        this.showToast('⚠️ Please enter your scholar name first!');
                        return;
                    }

                    const questionIndices = this.masterBank
                        .map((question, index) => index)
                        .filter(index => this.selectedSubject === 'all' || this.masterBank[index].subject === this.selectedSubject);
                    let unseenIndices = questionIndices.filter(index => !this.seenQuestions[index]);

                    if (unseenIndices.length === 0) {
                        questionIndices.forEach(index => delete this.seenQuestions[index]);
                        unseenIndices = questionIndices;
                    }

                    for (let i = unseenIndices.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [unseenIndices[i], unseenIndices[j]] = [unseenIndices[j], unseenIndices[i]];
                    }

                    this.runQuestions = unseenIndices.map(index => {
                        const question = this.masterBank[index];
                        const options = [...question.options];
                        for (let i = options.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [options[i], options[j]] = [options[j], options[i]];
                        }
                        return { ...question, options };
                    });
                    this.seenQuestions[unseenIndices[0]] = true;
                    this.xp = 0;
                    this.correctCount = 0;
                    this.currentIndex = 0;
                    this.gameState = 'playing';
                    this.answered = false;
                    this.selectedAnswer = null;
                },

                submitAnswer(option) {
                    if (this.answered) return;
                    this.answered = true;
                    this.selectedAnswer = option;

                    if (option === this.currentQuestion.answer) {
                        this.xp += 50;
                        this.correctCount++;
                        this.showToast('🎉 Correct! +50 XP Learned');
                    } else {
                        this.showToast('❌ Incorrect! Review the insight below.');
                    }

                    this.scheduleNextQuestion(); // Gives time to read explanation
                },

                resetGame() {
                    if (this.pendingTimeout) {
                        clearTimeout(this.pendingTimeout);
                        this.pendingTimeout = null;
                    }
                    this.gameState = 'lobby';
                    this.answered = false;
                    this.selectedAnswer = null;
                },

                showToast(msg) {
                    this.toastMessage = msg;
                    setTimeout(() => {
                        this.toastMessage = '';
                    }, 3000);
                }
            }
        }
